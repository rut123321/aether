<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Проверка баланса - Aether</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .balance-container {
        max-width: 500px;
        margin: 0 auto;
        padding: 40px;
      }
      .balance-header {
        text-align: center;
        margin-bottom: 32px;
      }
      .balance-header h1 {
        font-size: 32px;
        margin-bottom: 8px;
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .balance-header p {
        color: var(--muted);
        font-size: 14px;
      }
      .result-card {
        margin-top: 24px;
        padding: 24px;
        border-radius: 16px;
        display: none;
        animation: slideIn 0.3s ease;
      }
      .result-card.show {
        display: block;
      }
      .result-card.success {
        background: var(--success-bg);
        border: 1px solid var(--success);
      }
      .result-card.error {
        background: var(--danger-bg);
        border: 1px solid var(--danger);
      }
      .result-card h2 {
        font-size: 18px;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .result-card p {
        margin: 8px 0;
        color: var(--ink);
      }
      .result-card strong {
        color: var(--ink);
        font-weight: 600;
      }
      .balance-info {
        display: grid;
        gap: 12px;
        margin-top: 16px;
      }
      .balance-info-item {
        display: flex;
        justify-content: space-between;
        padding: 12px 16px;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 8px;
      }
      .balance-info-item label {
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
      }
      .balance-info-item span {
        color: var(--ink);
        font-weight: 600;
        font-size: 14px;
      }
      .loading {
        text-align: center;
        color: var(--muted);
        margin-top: 20px;
        display: none;
        padding: 20px;
      }
      .loading.show {
        display: block;
      }
      .back-link {
        text-align: center;
        margin-top: 32px;
      }
      .back-link a {
        color: var(--muted);
        text-decoration: none;
        font-size: 14px;
        transition: color 0.2s;
      }
      .back-link a:hover {
        color: var(--primary);
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="balance-container">
            <div class="balance-header">
              <h1>💰 Проверка баланса</h1>
              <p>Введите ваш API ключ для проверки баланса кредитов</p>
            </div>
            <form id="balanceForm" class="key-form" style="grid-template-columns: 1fr;">
              <label>
                API ключ
                <input 
                  id="apiKey" 
                  type="text" 
                  placeholder="sk-..." 
                  required 
                  autocomplete="off"
                />
              </label>
              <button class="primary-button" type="submit">Проверить баланс</button>
            </form>
            <div class="loading" id="loading">
              <span>⏳</span> Проверка...
            </div>
            <div class="result-card" id="result">
              <h2 id="resultTitle"></h2>
              <div id="resultContent"></div>
            </div>
            <div class="back-link">
              <a href="/">← Вернуться на главную</a>
            </div>
      </div>
    </main>

    <script>
      const form = document.getElementById("balanceForm");
      const loading = document.getElementById("loading");
      const result = document.getElementById("result");
      const resultTitle = document.getElementById("resultTitle");
      const resultContent = document.getElementById("resultContent");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const apiKey = document.getElementById("apiKey").value.trim();
        
        if (!apiKey) {
          showResult("error", "❌ Ошибка", "Введите API ключ");
          return;
        }

        loading.classList.add("show");
        result.classList.remove("show");

        try {
          const response = await fetch("/api/balance", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ key: apiKey }),
          });

          const data = await response.json();

          if (response.ok) {
            showResult(
              "success",
              "✅ Баланс найден",
              `<div class="balance-info">
                <div class="balance-info-item">
                  <label>Название</label>
                  <span>${data.name}</span>
                </div>
                <div class="balance-info-item">
                  <label>Кредиты</label>
                  <span>${data.balance.toLocaleString()}</span>
                </div>
              </div>`
            );
          } else {
            showResult("error", "❌ Ошибка", data.error || "Ключ не найден");
          }
        } catch (error) {
          showResult("error", "❌ Ошибка", error.message);
        } finally {
          loading.classList.remove("show");
        }
      });

      function showResult(type, title, content) {
        result.className = `result-card show ${type}`;
        resultTitle.textContent = title;
        resultContent.innerHTML = content;
      }
    </script>
  </body>
</html>
