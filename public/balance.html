<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Проверка баланса - Aether</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .standalone-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      .standalone-card {
        width: 100%;
        max-width: 520px;
        padding: 48px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-lg);
        background: var(--surface);
        background-image: radial-gradient(ellipse 70% 60% at 50% 0%, rgba(6, 182, 212, 0.04), transparent);
        box-shadow: var(--shadow-xl);
      }
      .balance-header {
        text-align: center;
        margin-bottom: 36px;
      }
      .balance-header h1 {
        font-size: 32px;
        margin-bottom: 8px;
        background: var(--gradient-text);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        font-weight: 700;
        letter-spacing: -0.5px;
      }
      .balance-header p {
        color: var(--muted);
        font-size: 14px;
      }
      .result-card {
        margin-top: 24px;
        padding: 24px;
        border-radius: var(--radius);
        display: none;
        animation: slideIn 0.3s ease;
      }
      .result-card.show {
        display: block;
      }
      .result-card.success {
        background: var(--success-bg);
        border: 1px solid var(--success-border);
      }
      .result-card.error {
        background: var(--danger-bg);
        border: 1px solid var(--danger-border);
      }
      .result-card h2 {
        font-size: 16px;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
      }
      .result-card p {
        margin: 8px 0;
        color: var(--ink);
      }
      .result-card strong {
        color: var(--ink);
        font-weight: 600;
      }
      .balance-info {
        display: grid;
        gap: 10px;
        margin-top: 16px;
      }
      .balance-info-item {
        display: flex;
        justify-content: space-between;
        padding: 14px 18px;
        background: var(--bg-elevated);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
      }
      .balance-info-item label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .balance-info-item span {
        color: var(--ink);
        font-weight: 600;
        font-size: 14px;
      }
      .history-section {
        margin-top: 24px;
      }
      .history-title {
        font-size: 13px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 600;
        margin-bottom: 12px;
      }
      .history-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .history-table th,
      .history-table td {
        padding: 10px 12px;
        text-align: left;
        border-bottom: 1px solid var(--line);
      }
      .history-table th {
        color: var(--muted);
        font-weight: 500;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }
      .history-table td {
        color: var(--ink);
      }
      .history-table td.numeric {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .history-empty {
        padding: 16px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
      }
      .loading {
        text-align: center;
        color: var(--muted);
        margin-top: 20px;
        display: none;
        padding: 20px;
        font-size: 14px;
      }
      .loading.show {
        display: block;
      }
      .back-link {
        text-align: center;
        margin-top: 32px;
        padding-top: 24px;
        border-top: 1px solid var(--line);
      }
      .back-link a {
        color: var(--muted);
        text-decoration: none;
        font-size: 14px;
        transition: color 0.2s;
        font-weight: 500;
      }
      .back-link a:hover {
        color: var(--primary-light);
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="standalone-wrapper">
      <div class="standalone-card">
        <div class="balance-header">
          <h1>Проверка баланса</h1>
          <p>Введите ваш API ключ для проверки баланса кредитов</p>
        </div>
        <form id="balanceForm" class="key-form" style="grid-template-columns: 1fr;">
          <label>
            API ключ
            <input 
              id="apiKey" 
              type="text" 
              placeholder="sk-..." 
              required 
              autocomplete="off"
            />
          </label>
          <button class="primary-button" type="submit" style="margin-top:4px;">Проверить баланс</button>
        </form>
        <div class="loading" id="loading">
          Проверка...
        </div>
        <div class="result-card" id="result">
          <h2 id="resultTitle"></h2>
          <div id="resultContent"></div>
        </div>
        <div class="back-link">
          <a href="/">← Вернуться на главную</a>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById("balanceForm");
      const loading = document.getElementById("loading");
      const result = document.getElementById("result");
      const resultTitle = document.getElementById("resultTitle");
      const resultContent = document.getElementById("resultContent");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const apiKey = document.getElementById("apiKey").value.trim();
        
        if (!apiKey) {
          showResult("error", "Ошибка", "Введите API ключ");
          return;
        }

        loading.classList.add("show");
        result.classList.remove("show");

        try {
          const response = await fetch("/api/balance", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ key: apiKey }),
          });

          const data = await response.json();

          if (response.ok) {
            const historyHtml = renderHistory(data.history || []);
            showResult(
              "success",
              "Баланс найден",
              `<div class="balance-info">
                <div class="balance-info-item">
                  <label>Название</label>
                  <span>${escapeHtml(data.name)}</span>
                </div>
                <div class="balance-info-item">
                  <label>Кредиты</label>
                  <span>${data.balance.toLocaleString()}</span>
                </div>
              </div>
              <div class="history-section">
                <div class="history-title">Последние 10 запросов</div>
                ${historyHtml}
              </div>`
            );
          } else {
            showResult("error", "Ошибка", data.error || "Ключ не найден");
          }
        } catch (error) {
          showResult("error", "Ошибка", error.message);
        } finally {
          loading.classList.remove("show");
        }
      });

      function renderHistory(history) {
        if (!history.length) {
          return '<div class="history-empty">Запросов пока не было</div>';
        }
        const rows = history.map((h) => {
          const dt = h.createdAt ? new Date(h.createdAt) : null;
          const time = dt ? dt.toLocaleString() : "—";
          return `<tr>
            <td>${escapeHtml(time)}</td>
            <td>${escapeHtml(h.model || "—")}</td>
            <td class="numeric">${Number(h.tokens || 0).toLocaleString()}</td>
            <td class="numeric">${Number(h.credits || 0).toLocaleString()}</td>
          </tr>`;
        }).join("");
        return `<table class="history-table">
          <thead>
            <tr>
              <th>Время</th>
              <th>Модель</th>
              <th style="text-align:right">Токены</th>
              <th style="text-align:right">Кредиты</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>`;
      }

      function escapeHtml(s) {
        return String(s == null ? "" : s)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function showResult(type, title, content) {
        result.className = `result-card show ${type}`;
        resultTitle.textContent = title;
        resultContent.innerHTML = content;
      }
    </script>
  </body>
</html>
