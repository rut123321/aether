<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Проверка баланса API ключа</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0a0a0a;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        color: #e0e0e0;
      }
      .container {
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 16px;
        padding: 40px;
        max-width: 500px;
        width: 100%;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.5);
      }
      h1 {
        text-align: center;
        color: #e0e0e0;
        margin-bottom: 30px;
        font-size: 24px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        color: #888;
        font-weight: 600;
        font-size: 14px;
      }
      input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #333;
        border-radius: 8px;
        background: #252525;
        color: #e0e0e0;
        font-size: 16px;
        transition: border-color 0.3s;
      }
      input:focus {
        outline: none;
        border-color: #5a5a5a;
      }
      button {
        width: 100%;
        padding: 14px;
        background: #4a4a4a;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, background 0.2s;
      }
      button:hover {
        transform: translateY(-1px);
        background: #5a5a5a;
      }
      button:active {
        transform: translateY(0);
      }
      .result {
        margin-top: 24px;
        padding: 20px;
        border-radius: 8px;
        background: #252525;
        display: none;
      }
      .result.show {
        display: block;
      }
      .result.success {
        background: rgba(45, 90, 45, 0.2);
        border: 1px solid #2d5a2d;
      }
      .result.error {
        background: rgba(90, 45, 45, 0.2);
        border: 1px solid #5a2d2d;
      }
      .result h2 {
        font-size: 18px;
        margin-bottom: 12px;
        color: #e0e0e0;
      }
      .result p {
        margin: 8px 0;
        color: #c0c0c0;
      }
      .result strong {
        color: #e0e0e0;
      }
      .loading {
        text-align: center;
        color: #888;
        margin-top: 20px;
        display: none;
      }
      .loading.show {
        display: block;
      }
      .back-link {
        text-align: center;
        margin-top: 20px;
      }
      .back-link a {
        color: #888;
        text-decoration: none;
        font-size: 14px;
      }
      .back-link a:hover {
        color: #e0e0e0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Проверка баланса</h1>
      <form id="balanceForm">
        <div class="form-group">
          <label for="apiKey">API ключ</label>
          <input 
            id="apiKey" 
            type="text" 
            placeholder="sk-..." 
            required 
            autocomplete="off"
          />
        </div>
        <button type="submit">Проверить баланс</button>
      </form>
      <div class="loading" id="loading">Проверка...</div>
      <div class="result" id="result">
        <h2 id="resultTitle"></h2>
        <p id="resultContent"></p>
      </div>
      <div class="back-link">
        <a href="/">← Вернуться на главную</a>
      </div>
    </div>

    <script>
      const form = document.getElementById("balanceForm");
      const loading = document.getElementById("loading");
      const result = document.getElementById("result");
      const resultTitle = document.getElementById("resultTitle");
      const resultContent = document.getElementById("resultContent");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const apiKey = document.getElementById("apiKey").value.trim();
        
        if (!apiKey) {
          showResult("error", "Ошибка", "Введите API ключ");
          return;
        }

        loading.classList.add("show");
        result.classList.remove("show");

        try {
          const response = await fetch("/api/balance", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ key: apiKey }),
          });

          const data = await response.json();

          if (response.ok) {
            showResult(
              "success",
              "✅ Баланс найден",
              `<strong>Название:</strong> ${data.name}<br><strong>Кредиты:</strong> ${data.balance}`
            );
          } else {
            showResult("error", "❌ Ошибка", data.error || "Ключ не найден");
          }
        } catch (error) {
          showResult("error", "❌ Ошибка", error.message);
        } finally {
          loading.classList.remove("show");
        }
      });

      function showResult(type, title, content) {
        result.className = `result show ${type}`;
        resultTitle.textContent = title;
        resultContent.innerHTML = content;
      }
    </script>
  </body>
</html>
