<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Проверка баланса — Aether</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .standalone-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 32px 24px;
        overflow: hidden;
      }
      .standalone-wrapper::before,
      .standalone-wrapper::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        pointer-events: none;
        opacity: 0.4;
      }
      .standalone-wrapper::before {
        width: 360px;
        height: 360px;
        background: radial-gradient(circle, rgba(139, 92, 246, 0.34), transparent 70%);
        top: -100px;
        left: -100px;
        animation: drift 18s ease-in-out infinite;
      }
      .standalone-wrapper::after {
        width: 420px;
        height: 420px;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.26), transparent 70%);
        bottom: -120px;
        right: -120px;
        animation: drift 22s ease-in-out infinite reverse;
      }
      @keyframes drift {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(50px, -40px); }
      }
      .standalone-card {
        position: relative;
        width: 100%;
        max-width: 580px;
        padding: 44px 44px 36px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-lg);
        background: linear-gradient(180deg, rgba(17, 19, 42, 0.80), rgba(11, 13, 30, 0.90));
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        box-shadow: var(--shadow-xl);
        animation: cardIn 600ms var(--ease-spring);
      }
      .standalone-card::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(135deg, rgba(167, 139, 250, 0.40), transparent 40%, transparent 60%, rgba(56, 189, 248, 0.30));
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
                mask-composite: exclude;
        pointer-events: none;
      }
      @keyframes cardIn {
        from { opacity: 0; transform: translateY(20px) scale(0.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .balance-header {
        text-align: center;
        margin-bottom: 32px;
      }
      .balance-mark {
        display: inline-grid;
        width: 52px;
        height: 52px;
        place-items: center;
        border-radius: var(--radius);
        background: var(--gradient-iris);
        margin-bottom: 16px;
        color: #0b0d1e;
        box-shadow: 0 8px 34px rgba(139, 92, 246, 0.40), inset 0 1px 0 rgba(255, 255, 255, 0.28);
      }
      .balance-mark svg { width: 24px; height: 24px; }
      .balance-header h1 {
        font-family: "Sora", "Inter", sans-serif;
        font-size: 28px;
        margin: 0 0 6px;
        font-weight: 800;
        letter-spacing: -0.6px;
        background: var(--gradient-text);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .balance-header p {
        color: var(--muted);
        font-size: 14px;
        margin: 0;
      }
      .result-card {
        margin-top: 24px;
        padding: 22px;
        border-radius: var(--radius);
        display: none;
        animation: slideIn 320ms var(--ease-out);
      }
      .result-card.show { display: block; }
      .result-card.success {
        background: var(--success-bg);
        border: 1px solid var(--success-border);
      }
      .result-card.error {
        background: var(--danger-bg);
        border: 1px solid var(--danger-border);
      }
      .result-card h2 {
        font-size: 14px;
        margin: 0 0 14px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--ink);
      }
      .balance-info {
        display: grid;
        gap: 10px;
      }
      .balance-info-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 18px;
        background: rgba(15, 20, 36, 0.5);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        transition: border-color var(--dur) var(--ease);
      }
      .balance-info-item:hover { border-color: var(--line-emphasis); }
      .balance-info-item label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.6px;
      }
      .balance-info-item span {
        color: var(--ink);
        font-weight: 700;
        font-size: 15px;
        font-variant-numeric: tabular-nums;
      }
      .balance-info-item .credits-value {
        background: var(--gradient-text);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        font-size: 18px;
      }
      .history-section { margin-top: 24px; }
      .history-title {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.6px;
        font-weight: 700;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .history-title::before {
        content: "";
        width: 4px;
        height: 12px;
        background: var(--gradient-primary);
        border-radius: 2px;
      }
      .history-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        background: rgba(15, 20, 36, 0.4);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        overflow: hidden;
      }
      .history-table th, .history-table td {
        padding: 10px 14px;
        text-align: left;
        border-bottom: 1px solid var(--line);
      }
      .history-table tbody tr:last-child td { border-bottom: none; }
      .history-table tbody tr {
        transition: background-color var(--dur) var(--ease);
      }
      .history-table tbody tr:hover { background: rgba(167, 139, 250, 0.06); }
      .history-table th {
        color: var(--muted);
        font-weight: 600;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        background: rgba(10, 13, 26, 0.6);
      }
      .history-table td { color: var(--ink); }
      .history-table td.numeric {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .history-table .model-tag {
        display: inline-block;
        padding: 2px 8px;
        background: rgba(167, 139, 250, 0.12);
        border: 1px solid rgba(167, 139, 250, 0.28);
        border-radius: 999px;
        color: var(--primary);
        font-size: 11px;
        font-family: "JetBrains Mono", monospace;
      }
      .history-empty {
        padding: 18px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        border: 1px dashed var(--line-strong);
        border-radius: var(--radius-sm);
        background: rgba(15, 20, 36, 0.3);
      }
      .loading {
        text-align: center;
        color: var(--muted);
        margin-top: 20px;
        display: none;
        padding: 16px;
        font-size: 13px;
      }
      .loading.show { display: flex; align-items: center; justify-content: center; gap: 10px; }
      .loading::before {
        content: "";
        width: 14px;
        height: 14px;
        border: 2px solid var(--line-strong);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .back-link {
        text-align: center;
        margin-top: 28px;
        padding-top: 22px;
        border-top: 1px solid var(--line);
      }
      .back-link a {
        color: var(--muted);
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
        transition: color var(--dur) var(--ease);
      }
      .back-link a:hover { color: var(--primary); }
      @keyframes slideIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div class="standalone-wrapper">
      <div class="standalone-card">
        <div class="balance-header">
          <div class="balance-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7"/>
              <path d="M3 7l9 6 9-6"/>
              <path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2"/>
            </svg>
          </div>
          <h1>Проверка баланса</h1>
          <p>Введите API ключ, чтобы увидеть остаток и историю</p>
        </div>
        <form id="balanceForm" class="key-form" style="grid-template-columns: 1fr;">
          <label>
            API ключ
            <input
              id="apiKey"
              type="text"
              placeholder="sk-..."
              required
              autocomplete="off"
              spellcheck="false"
            />
          </label>
          <button class="primary-button" type="submit" style="margin-top: 4px;">Проверить</button>
        </form>
        <div class="loading" id="loading">Проверяем...</div>
        <div class="result-card" id="result">
          <h2 id="resultTitle"></h2>
          <div id="resultContent"></div>
        </div>
        <div class="back-link">
          <a href="/">← Вернуться на главную</a>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById("balanceForm");
      const loading = document.getElementById("loading");
      const result = document.getElementById("result");
      const resultTitle = document.getElementById("resultTitle");
      const resultContent = document.getElementById("resultContent");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const apiKey = document.getElementById("apiKey").value.trim();

        if (!apiKey) {
          showResult("error", "Ошибка", "Введите API ключ");
          return;
        }

        loading.classList.add("show");
        result.classList.remove("show");

        try {
          const response = await fetch("/api/balance", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ key: apiKey }),
          });

          const data = await response.json();

          if (response.ok) {
            const historyHtml = renderHistory(data.history || []);
            showResult(
              "success",
              "Баланс найден",
              `<div class="balance-info">
                <div class="balance-info-item">
                  <label>Название</label>
                  <span>${escapeHtml(data.name)}</span>
                </div>
                <div class="balance-info-item">
                  <label>Кредиты</label>
                  <span class="credits-value">${data.balance.toLocaleString()}</span>
                </div>
              </div>
              <div class="history-section">
                <div class="history-title">Последние 10 запросов</div>
                ${historyHtml}
              </div>`
            );
          } else {
            showResult("error", "Ошибка", extractError(data) || "Ключ не найден");
          }
        } catch (error) {
          showResult("error", "Ошибка", error.message);
        } finally {
          loading.classList.remove("show");
        }
      });

      function extractError(data) {
        if (!data) return "";
        if (typeof data.error === "string") return data.error;
        if (data.error && typeof data.error.message === "string") return data.error.message;
        if (typeof data.message === "string") return data.message;
        return "";
      }

      function renderHistory(history) {
        if (!history.length) {
          return '<div class="history-empty">Запросов пока не было</div>';
        }
        const rows = history.map((h) => {
          const dt = h.createdAt ? new Date(h.createdAt) : null;
          const time = dt ? dt.toLocaleString() : "—";
          const model = h.model ? `<span class="model-tag">${escapeHtml(h.model)}</span>` : "—";
          return `<tr>
            <td>${escapeHtml(time)}</td>
            <td>${model}</td>
            <td class="numeric">${Number(h.tokens || 0).toLocaleString()}</td>
            <td class="numeric">${Number(h.credits || 0).toLocaleString()}</td>
          </tr>`;
        }).join("");
        return `<table class="history-table">
          <thead>
            <tr>
              <th>Время</th>
              <th>Модель</th>
              <th style="text-align:right">Токены</th>
              <th style="text-align:right">Кредиты</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>`;
      }

      function escapeHtml(s) {
        return String(s == null ? "" : s)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function showResult(type, title, content) {
        result.className = `result-card show ${type}`;
        resultTitle.textContent = title;
        resultContent.innerHTML = content;
      }
    </script>
  </body>
</html>
