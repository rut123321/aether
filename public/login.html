<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Вход — Aether</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .login-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        overflow: hidden;
      }
      .login-wrapper::before,
      .login-wrapper::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        pointer-events: none;
        opacity: 0.5;
      }
      .login-wrapper::before {
        width: 380px;
        height: 380px;
        background: radial-gradient(circle, rgba(34, 211, 238, 0.30), transparent 70%);
        top: -120px;
        left: -120px;
        animation: float 14s ease-in-out infinite;
      }
      .login-wrapper::after {
        width: 420px;
        height: 420px;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.28), transparent 70%);
        bottom: -140px;
        right: -140px;
        animation: float 18s ease-in-out infinite reverse;
      }
      @keyframes float {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(40px, -30px); }
      }
      .login-card {
        position: relative;
        width: 100%;
        max-width: 420px;
        padding: 44px 40px 36px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-lg);
        background: linear-gradient(180deg, rgba(15, 20, 36, 0.85), rgba(10, 13, 26, 0.92));
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        box-shadow: var(--shadow-xl);
        animation: cardIn 600ms var(--ease-spring);
      }
      .login-card::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(135deg, rgba(34, 211, 238, 0.30), transparent 40%, transparent 60%, rgba(99, 102, 241, 0.24));
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
                mask-composite: exclude;
        pointer-events: none;
      }
      @keyframes cardIn {
        from { opacity: 0; transform: translateY(20px) scale(0.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .login-header { text-align: center; margin-bottom: 32px; }
      .login-mark {
        display: inline-grid;
        width: 56px;
        height: 56px;
        place-items: center;
        border-radius: var(--radius);
        background: linear-gradient(135deg, rgba(34, 211, 238, 0.18), rgba(99, 102, 241, 0.14));
        color: var(--primary);
        font-weight: 700;
        font-size: 18px;
        letter-spacing: -0.5px;
        margin-bottom: 18px;
        border: 1px solid rgba(34, 211, 238, 0.26);
        box-shadow: 0 0 40px rgba(34, 211, 238, 0.20), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        animation: markGlow 4s ease-in-out infinite;
      }
      @keyframes markGlow {
        0%, 100% { box-shadow: 0 0 30px rgba(34, 211, 238, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.06); }
        50% { box-shadow: 0 0 50px rgba(34, 211, 238, 0.30), inset 0 1px 0 rgba(255, 255, 255, 0.08); }
      }
      .login-header h1 {
        margin: 0 0 8px;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.5px;
        background: var(--gradient-text);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .login-header p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }
      .login-form { display: grid; gap: 16px; }
      .login-error {
        color: var(--danger);
        font-size: 13px;
        margin: 0;
        text-align: center;
        display: none;
        padding: 10px 14px;
        background: var(--danger-bg);
        border: 1px solid var(--danger-border);
        border-radius: var(--radius-sm);
      }
      .login-error.show { display: block; }
      .shake {
        animation: shake 420ms cubic-bezier(0.36, 0.07, 0.19, 0.97);
      }
      @keyframes shake {
        10%, 90% { transform: translateX(-2px); }
        20%, 80% { transform: translateX(3px); }
        30%, 50%, 70% { transform: translateX(-5px); }
        40%, 60% { transform: translateX(5px); }
      }
      .login-links {
        text-align: center;
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: center;
        gap: 20px;
      }
      .login-links a {
        color: var(--muted);
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
        transition: color var(--dur) var(--ease);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .login-links a:hover { color: var(--primary); }
      .login-button {
        position: relative;
        width: 100%;
        margin-top: 4px;
      }
      .login-button.loading {
        pointer-events: none;
        opacity: 0.7;
      }
      .login-button.loading::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 16px;
        height: 16px;
        margin: -8px 0 0 -8px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      .login-button.loading > span { opacity: 0; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="login-wrapper">
      <div class="login-card" id="loginCard">
        <div class="login-header">
          <div class="login-mark" aria-hidden="true">AE</div>
          <h1>Aether</h1>
          <p>Введите пароль администратора для входа</p>
        </div>
        <form id="loginForm" class="login-form" autocomplete="off">
          <label>
            Пароль
            <input id="loginPassword" type="password" placeholder="Введите пароль" autocomplete="current-password" required autofocus />
          </label>
          <button type="submit" class="primary-button login-button" id="loginButton"><span>Войти</span></button>
          <p id="loginError" class="login-error">Неверный пароль</p>
        </form>
        <div class="login-links">
          <a href="/faq">FAQ</a>
          <a href="/balance">Проверить баланс</a>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById("loginForm");
      const passwordInput = document.getElementById("loginPassword");
      const error = document.getElementById("loginError");
      const card = document.getElementById("loginCard");
      const button = document.getElementById("loginButton");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        error.classList.remove("show");
        button.classList.add("loading");

        try {
          const response = await fetch("/api/admin/verify", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ password: passwordInput.value }),
          });

          if (response.ok) {
            window.location.href = "/";
            return;
          }
          fail();
        } catch {
          fail();
        }
      });

      function fail() {
        button.classList.remove("loading");
        error.classList.add("show");
        card.classList.remove("shake");
        // restart shake animation
        void card.offsetWidth;
        card.classList.add("shake");
        passwordInput.value = "";
        passwordInput.focus();
      }
    </script>
  </body>
</html>
