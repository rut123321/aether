<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Вход — Aether</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .login-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      .login-card {
        width: 100%;
        max-width: 400px;
        padding: 40px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-lg);
        background: var(--surface);
        box-shadow: var(--shadow-lg);
      }
      .login-header {
        text-align: center;
        margin-bottom: 28px;
      }
      .login-mark {
        display: inline-grid;
        width: 48px;
        height: 48px;
        place-items: center;
        border-radius: var(--radius-sm);
        background: var(--surface-2);
        color: var(--primary);
        font-weight: 700;
        font-size: 18px;
        margin-bottom: 16px;
        border: 1px solid var(--line-strong);
      }
      .login-header h1 {
        margin: 0 0 6px;
        font-size: 22px;
        font-weight: 700;
        color: var(--ink);
      }
      .login-header p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }
      .login-form {
        display: grid;
        gap: 14px;
      }
      .login-form label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }
      .login-form input {
        min-height: 44px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-sm);
        background: var(--bg-elevated);
        color: var(--ink);
        padding: 10px 16px;
        font-size: 14px;
        outline: none;
      }
      .login-form input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
      }
      .login-error {
        color: var(--danger);
        font-size: 13px;
        margin: 0;
        text-align: center;
        display: none;
      }
      .login-links {
        text-align: center;
        margin-top: 20px;
      }
      .login-links a {
        color: var(--muted);
        text-decoration: none;
        font-size: 14px;
        transition: color 0.2s;
      }
      .login-links a:hover {
        color: var(--primary);
      }
    </style>
  </head>
  <body>
    <div class="login-wrapper">
      <div class="login-card">
        <div class="login-header">
          <div class="login-mark">AE</div>
          <h1>Aether</h1>
          <p>Введите пароль администратора</p>
        </div>
        <form id="loginForm" class="login-form" autocomplete="off">
          <label>
            Пароль
            <input id="loginPassword" type="password" placeholder="Введите пароль" required />
          </label>
          <button type="submit" class="primary-button" style="width: 100%;">Войти</button>
          <p id="loginError" class="login-error">Неверный пароль</p>
        </form>
        <div class="login-links">
          <a href="/faq">FAQ</a> · <a href="/balance">Баланс</a>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById("loginForm");
      const passwordInput = document.getElementById("loginPassword");
      const error = document.getElementById("loginError");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        error.style.display = "none";

        try {
          const response = await fetch("/api/admin/verify", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ password: passwordInput.value.trim() }),
          });

          if (response.ok) {
            window.location.href = "/";
          } else {
            error.style.display = "block";
            passwordInput.value = "";
            passwordInput.focus();
          }
        } catch {
          error.style.display = "block";
          passwordInput.value = "";
          passwordInput.focus();
        }
      });
    </script>
  </body>
</html>
